# Replace these placeholder values before applying, e.g.:
#   kubectl create secret generic postgres-secret -n shaadi-crm \
#     --from-literal=POSTGRES_USER=shaadi \
#     --from-literal=POSTGRES_PASSWORD='<strong-password>' \
#     --from-literal=POSTGRES_DB=shaadi_crm
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: shaadi-crm
type: Opaque
stringData:
  POSTGRES_USER: shaadi
  POSTGRES_PASSWORD: CHANGE_ME_STRONG_PASSWORD
  POSTGRES_DB: shaadi_crm
