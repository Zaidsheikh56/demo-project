apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: shaadi-crm
spec:
  replicas: 2
  selector:
    matchLabels: { app: backend }
  template:
    metadata:
      labels: { app: backend }
    spec:
      containers:
        - name: backend
          # Replace with your ECR image, e.g.:
          # 123456789012.dkr.ecr.ap-south-1.amazonaws.com/shaadi-crm-backend:latest
          image: <ACCOUNT_ID>.dkr.ecr.<REGION>.amazonaws.com/shaadi-crm-backend:latest
          ports: [{ containerPort: 8000 }]
          envFrom:
            - secretRef: { name: backend-secret }
            - configMapRef: { name: backend-config }
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: "150m", memory: "256Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
